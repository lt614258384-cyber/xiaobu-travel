# ── 小布的旅行 docker-compose.yml ──
# Local testing with app + PostgreSQL
#
# Copy .env.example to .env and fill in real values before deploying.
# FORCE_SECURE_COOKIES=true should only be set when a TLS termination proxy
# (nginx, Caddy, Railway, etc.) serves HTTPS in front of the app.
# Without HTTPS, Secure cookies are rejected by browsers and login breaks.

services:
  app:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql://xiaobu:xiaobu@db:5432/xiaobu
      - PORT=8000
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./data:/app/data

  db:
    image: postgres:16-alpine
    environment:
      - POSTGRES_USER=xiaobu
      - POSTGRES_PASSWORD=${DB_PASSWORD:-xiaobu}
      - POSTGRES_DB=xiaobu
    # No ports exposed — only accessible from internal Docker network
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U xiaobu"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pg_data:
